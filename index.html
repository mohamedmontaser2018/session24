<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Convert Dollar To Egyption Pound</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="page">
  <h1>Convert Dollar To Egyption Pound</h1>

  <input type="number" id="dollarInput" placeholder="Enter Amout of Dollar" min="0" step="any" />

  <button id="convertBtn">Convert</button>

  <p id="result">Enter Data</p>

  <p class="rate-note">Rate used: 1 USD = <span id="rateLabel"></span> EGP (editable below for testing)</p>
  <label class="rate-editor">
    Exchange rate
    <input type="number" id="rateInput" min="0" step="0.01" />
  </label>
</div>

<script src="script.js"></script>
</body>
</html>
